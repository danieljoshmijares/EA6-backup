<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Employee Records System</h1>

  <!-- Add Record Section -->
  <div class="section">
    <h2>Add New Employee</h2>
    <form id="addForm">
      <label>Employee ID: <input type="text" name="empid" required></label>
      <label>First Name: <input type="text" name="firstname" required></label>
      <label>Middle Name: <input type="text" name="middlename"></label>
      <label>Last Name: <input type="text" name="lastname" required></label>
      <label>Position: <input type="text" name="position" required></label>
      <label>Department: <input type="text" name="department" required></label>
      <label>Salary: <input type="number" name="salary" required></label>
      <button type="submit">Add Record</button>
      <button type="button" id="clearAdd">Clear</button>
    </form>
    <div id="addResult" class="result"></div>
  </div>

  <!-- Search Record Section -->
  <div class="section">
    <h2>Search Employee</h2>
    <form id="searchForm">
      <label>Employee ID: <input type="text" name="empid" required></label>
      <button type="submit">Search</button>
      <button type="button" id="clearSearch">Clear</button>
    </form>
    <div id="searchResult" class="result"></div>
  </div>

  <!-- Update Record Section -->
  <div class="section">
    <h2>Update Employee</h2>
    <form id="updateForm">
      <label>Employee ID: <input type="text" name="empid" required></label>
      <label>First Name: <input type="text" name="firstname"></label>
      <label>Middle Name: <input type="text" name="middlename"></label>
      <label>Last Name: <input type="text" name="lastname"></label>
      <label>Position: <input type="text" name="position"></label>
      <label>Department: <input type="text" name="department"></label>
      <label>Salary: <input type="number" name="salary"></label>
      <button type="submit">Update Record</button>
      <button type="button" id="clearUpdate">Clear</button>
    </form>
    <div id="updateResult" class="result"></div>
  </div>

  <!-- Delete Record Section -->
  <div class="section">
    <h2>Delete Employee</h2>
    <form id="deleteForm">
      <label>Employee ID: <input type="text" name="empid" required></label>
      <button type="submit">Delete Record</button>
      <button type="button" id="clearDelete">Clear</button>
    </form>
    <div id="deleteResult" class="result"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
